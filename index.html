<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Selecione seu perfil e comece a assistir filmes e séries na Netflix Brasil">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
  <title>Netflix Brasil - assistir a séries online, assistir a filmes online</title>
</head>
<body>
  <main>
    <div style="position: fixed; top: 20px; right: 20px; z-index: 1000;">
      <button class="theme-toggle" id="themeToggle" title="Alternar tema" onclick="toggleDarkMode()">🌙</button>
    </div>
    <section class="profile-selection">
      <h1>Quem está assistindo?</h1>
      
      
        <figure class="profile">
          <img src="/assets/perfil1.png" alt="Perfil do usuário 1">
          <figcaption>Perfil 1</figcaption>
        </figure>
   
      
        <figure class="profile">
          <img src="/assets/perfil2.png" alt="Perfil do usuário 2">
          <figcaption>Perfil 2</figcaption>
        </figure>
    </section>
  </main>
</body>
</html>
